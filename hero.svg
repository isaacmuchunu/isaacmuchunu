    <text x="947" y="226" fill="#65E7C8">"full-stack systems",</text>

    <text x="888" y="259" fill="#7E8795">04</text>
    <text x="947" y="259" fill="#65E7C8">"artificial intelligence",</text>

    <text x="888" y="292" fill="#7E8795">05</text>
    <text x="947" y="292" fill="#65E7C8">"cybersecurity",</text>

    <text x="888" y="325" fill="#7E8795">06</text>
    <text x="947" y="325" fill="#65E7C8">"healthcare technology"</text>

    <text x="888" y="358" fill="#7E8795">07</text>
